name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > $GITHUB_WORKSPACE/ip-tester-release.keystore
      - run: chmod +x gradlew || true
      - run: |
          if [ ! -f gradlew ]; then echo "gradlew missing, using gradle directly"; gradle assembleDebug; else ./gradlew assembleDebug; fi
        env:
          IPTESTER_KEYSTORE_PATH: ${{ github.workspace }}/ip-tester-release.keystore
          IPTESTER_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          IPTESTER_KEY_ALIAS: iptester
          IPTESTER_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
